name: Staging promotion gate
description: Verify reviewed staging-promotion metadata and its immutable source evidence
inputs:
  operation:
    description: Action operation, either verify, prepare-plan-evidence, or consume-solo
    required: false
    default: verify
  promotion-pr-number:
    description: Merged PR number containing the staging-promotion manifest
    required: false
    default: ""
  verification-mode:
    description: Verification operation, either promotion or source-pr
    required: false
    default: promotion
  source-pr-number:
    description: Reviewed source PR number for the isolated Terraform planning workflow
    required: false
    default: ""
  expected-manifest-sha:
    description: Expected manifest SHA-256 from the earlier validation job
    required: false
    default: ""
  trusted-image-producer-workflow:
    description: Admin-configured immutable reusable image workflow ref
    required: false
    default: ""
  trusted-plan-producer-workflow:
    description: Admin-configured immutable reusable Terraform plan workflow ref
    required: false
    default: ""
  plan-artifact-path:
    description: Downloaded saved Terraform plan file; required for credential-bearing apply validation
    required: false
    default: ""
  evidence-record-path:
    description: Downloaded signed Terraform evidence JSON; required for credential-bearing apply validation
    required: false
    default: ""
  evidence-signature-path:
    description: Downloaded KMS signature base64 file; required for credential-bearing apply validation
    required: false
    default: ""
  plan-target-account-id:
    description: Protected staging member-account ID
    required: false
    default: ""
  plan-target-region:
    description: Protected staging member-account region
    required: false
    default: ""
  plan-layer:
    description: Allowlisted Terraform staging layer enum
    required: false
    default: ""
  plan-signing-key-arn:
    description: Immutable AWS KMS signing key ARN
    required: false
    default: ""
  plan-signing-public-key-der-b64:
    description: Pinned DER-encoded KMS public key in base64
    required: false
    default: ""
  plan-artifact-id:
    description: Immutable artifact ID from the trusted plan producer
    required: false
    default: ""
  plan-artifact-digest:
    description: Immutable GitHub artifact digest from the trusted plan producer
    required: false
    default: ""
  source-pull-request-head-sha:
    description: Exact reviewed source pull request head
    required: false
    default: ""
  source-pull-request-merge-sha:
    description: Exact reviewed source pull request merge commit
    required: false
    default: ""
  evidence-output-directory:
    description: Directory for canonical signed evidence JSON
    required: false
    default: ""
  approval-mode:
    description: Protected configuration selecting independent or solo authorization
    required: false
    default: independent
  solo-authorizer-id:
    description: Protected immutable GitHub user ID
    required: false
    default: ""
  solo-max-age-seconds:
    description: Protected maximum age of each solo authorization, at most 86400 seconds
    required: false
    default: ""
  solo-source-comment-id:
    description: Source PR authorization comment ID
    required: false
    default: ""
  solo-promotion-comment-id:
    description: Promotion PR authorization comment ID
    required: false
    default: ""
  solo-target-account-id:
    description: Protected staging target account ID
    required: false
    default: ""
  solo-target-region:
    description: Protected staging target region
    required: false
    default: ""
  staging-ecr-registry:
    description: Protected staging destination ECR registry
    required: false
    default: ""
  ledger-role-arn:
    description: Protected audit-only ledger role ARN
    required: false
    default: ""
  ledger-table-arn:
    description: Protected authorization consumption table ARN
    required: false
    default: ""
  verified-manifest-sha:
    description: Manifest SHA-256 from the immediately preceding verifier
    required: false
    default: ""
  verified-promotion-head-sha:
    description: Promotion PR head from the immediately preceding verifier
    required: false
    default: ""
  verified-source-pr-number:
    description: Source PR number from the immediately preceding verifier
    required: false
    default: ""
  verified-source-head-sha:
    description: Source PR head from the immediately preceding verifier
    required: false
    default: ""
  verified-authorized-at:
    description: Authorization creation timestamp from the immediately preceding verifier
    required: false
    default: ""
  verified-source-authorized-at:
    description: Source authorization creation timestamp from the immediately preceding verifier
    required: false
    default: ""
  verified-target-resource:
    description: Staging target resource from the immediately preceding verifier
    required: false
    default: ""
outputs:
  promotion-kind:
    description: Verified promotion operation
    value: ${{ steps.verify.outputs.promotion_kind }}
  source-commit:
    description: Verified source commit
    value: ${{ steps.verify.outputs.source_commit }}
  source-repository:
    description: Verified source repository
    value: ${{ steps.verify.outputs.source_repository }}
  image-repository:
    description: Verified ECR repository for image promotions
    value: ${{ steps.verify.outputs.image_repository }}
  image-digest:
    description: Verified immutable source image digest
    value: ${{ steps.verify.outputs.image_digest }}
  manifest-sha256:
    description: SHA-256 of the approved promotion manifest
    value: ${{ steps.verify.outputs.manifest_sha256 }}
  producer-run-id:
    description: Verified Terraform producer run ID
    value: ${{ steps.verify.outputs.producer_run_id }}
  plan-artifact-id:
    description: Verified immutable Terraform plan artifact ID
    value: ${{ steps.verify.outputs.plan_artifact_id }}
  evidence-artifact-id:
    description: Verified immutable Terraform evidence artifact ID
    value: ${{ steps.verify.outputs.evidence_artifact_id }}
  approval-mode:
    description: Verified staging authorization mode
    value: ${{ steps.verify.outputs.approval_mode }}
  promotion-head-sha:
    description: Exact promotion PR head SHA
    value: ${{ steps.verify.outputs.promotion_head_sha }}
  solo-authorization-created-at:
    description: GitHub timestamp of the solo promotion authorization
    value: ${{ steps.verify.outputs.solo_authorization_created_at }}
  solo-source-authorization-created-at:
    description: GitHub timestamp of the solo source authorization
    value: ${{ steps.verify.outputs.solo_source_authorization_created_at }}
  solo-target-resource:
    description: Authorized staging resource
    value: ${{ steps.verify.outputs.solo_target_resource }}
  source-pr-number:
    description: Verified source pull request number
    value: ${{ steps.verify.outputs.source_pr_number }}
  source-pull-request-head-sha:
    description: Exact reviewed source pull request head
    value: ${{ steps.verify.outputs.source_pull_request_head_sha }}
  source-pull-request-merge-sha:
    description: Exact source pull request merge commit
    value: ${{ steps.verify.outputs.source_pull_request_merge_sha }}
  plan-layer:
    description: Verified staging Terraform layer
    value: ${{ steps.verify.outputs.plan_layer }}
  terraform-root:
    description: Exact allowlisted staging Terraform root
    value: ${{ steps.verify.outputs.terraform_root }}
runs:
  using: composite
  steps:
    - name: Validate operation
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
      run: |
        case "$OPERATION" in
          verify|prepare-plan-evidence|consume-solo) ;;
          *) echo "::error::Unsupported staging gate operation"; exit 1 ;;
        esac

    - id: consume
      if: inputs.operation == 'consume-solo'
      shell: bash
      env:
        STAGING_SOLO_LEDGER_ROLE_ARN: ${{ inputs.ledger-role-arn }}
        STAGING_SOLO_LEDGER_TABLE_ARN: ${{ inputs.ledger-table-arn }}
        STAGING_SOLO_SOURCE_COMMENT_ID: ${{ inputs.solo-source-comment-id }}
        STAGING_SOLO_PROMOTION_COMMENT_ID: ${{ inputs.solo-promotion-comment-id }}
        STAGING_SOLO_AUTHORIZER_ID: ${{ inputs.solo-authorizer-id }}
        STAGING_SOLO_TARGET_ACCOUNT_ID: ${{ inputs.solo-target-account-id }}
        STAGING_SOLO_TARGET_REGION: ${{ inputs.solo-target-region }}
        PROMOTION_PR_NUMBER: ${{ inputs.promotion-pr-number }}
        MANIFEST_SHA256: ${{ inputs.verified-manifest-sha }}
        PROMOTION_HEAD_SHA: ${{ inputs.verified-promotion-head-sha }}
        SOURCE_PR_NUMBER: ${{ inputs.verified-source-pr-number }}
        SOURCE_HEAD_SHA: ${{ inputs.verified-source-head-sha }}
        AUTHORIZED_AT: ${{ inputs.verified-authorized-at }}
        SOURCE_AUTHORIZED_AT: ${{ inputs.verified-source-authorized-at }}
        TARGET_RESOURCE: ${{ inputs.verified-target-resource }}
      run: python3 "$GITHUB_ACTION_PATH/consume_solo.py"

    - id: prepare
      if: inputs.operation == 'prepare-plan-evidence'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_PR_NUMBER: ${{ inputs.source-pr-number }}
        SOURCE_PR_HEAD_SHA: ${{ inputs.source-pull-request-head-sha }}
        SOURCE_PR_MERGE_SHA: ${{ inputs.source-pull-request-merge-sha }}
        PLAN_ARTIFACT_ID: ${{ inputs.plan-artifact-id }}
        PLAN_ARTIFACT_DIGEST: ${{ inputs.plan-artifact-digest }}
        PLAN_ARTIFACT_PATH: ${{ inputs.plan-artifact-path }}
        EVIDENCE_OUTPUT_DIRECTORY: ${{ inputs.evidence-output-directory }}
        STAGING_TRUSTED_PLAN_WORKFLOW: ${{ inputs.trusted-plan-producer-workflow }}
        STAGING_PLAN_TARGET_ACCOUNT_ID: ${{ inputs.plan-target-account-id }}
        STAGING_PLAN_TARGET_REGION: ${{ inputs.plan-target-region }}
        STAGING_PLAN_LAYER: ${{ inputs.plan-layer }}
        STAGING_PLAN_SIGNING_KEY_ARN: ${{ inputs.plan-signing-key-arn }}
        STAGING_APPROVAL_MODE: ${{ inputs.approval-mode }}
        STAGING_SOLO_AUTHORIZER_ID: ${{ inputs.solo-authorizer-id }}
        STAGING_SOLO_APPROVAL_MAX_AGE_SECONDS: ${{ inputs.solo-max-age-seconds }}
        STAGING_SOLO_SOURCE_COMMENT_ID: ${{ inputs.solo-source-comment-id }}
        STAGING_SOLO_TARGET_ACCOUNT_ID: ${{ inputs.solo-target-account-id }}
        STAGING_SOLO_TARGET_REGION: ${{ inputs.solo-target-region }}
      run: python3 "$GITHUB_ACTION_PATH/create_plan_evidence.py"

    - id: verify
      if: inputs.operation == 'verify'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PROMOTION_PR_NUMBER: ${{ inputs.promotion-pr-number }}
        VERIFICATION_MODE: ${{ inputs.verification-mode }}
        SOURCE_PR_NUMBER: ${{ inputs.source-pr-number }}
        EXPECTED_MANIFEST_SHA: ${{ inputs.expected-manifest-sha }}
        TRUSTED_IMAGE_PRODUCER_WORKFLOW: ${{ inputs.trusted-image-producer-workflow }}
        TRUSTED_PLAN_PRODUCER_WORKFLOW: ${{ inputs.trusted-plan-producer-workflow }}
        PLAN_ARTIFACT_PATH: ${{ inputs.plan-artifact-path }}
        EVIDENCE_RECORD_PATH: ${{ inputs.evidence-record-path }}
        EVIDENCE_SIGNATURE_PATH: ${{ inputs.evidence-signature-path }}
        STAGING_PLAN_TARGET_ACCOUNT_ID: ${{ inputs.plan-target-account-id }}
        STAGING_PLAN_TARGET_REGION: ${{ inputs.plan-target-region }}
        STAGING_PLAN_LAYER: ${{ inputs.plan-layer }}
        STAGING_PLAN_SIGNING_KEY_ARN: ${{ inputs.plan-signing-key-arn }}
        STAGING_PLAN_SIGNING_PUBLIC_KEY_DER_B64: ${{ inputs.plan-signing-public-key-der-b64 }}
        STAGING_APPROVAL_MODE: ${{ inputs.approval-mode }}
        STAGING_SOLO_AUTHORIZER_ID: ${{ inputs.solo-authorizer-id }}
        STAGING_SOLO_APPROVAL_MAX_AGE_SECONDS: ${{ inputs.solo-max-age-seconds }}
        STAGING_SOLO_SOURCE_COMMENT_ID: ${{ inputs.solo-source-comment-id }}
        STAGING_SOLO_PROMOTION_COMMENT_ID: ${{ inputs.solo-promotion-comment-id }}
        STAGING_SOLO_TARGET_ACCOUNT_ID: ${{ inputs.solo-target-account-id }}
        STAGING_SOLO_TARGET_REGION: ${{ inputs.solo-target-region }}
        STAGING_ECR_REGISTRY: ${{ inputs.staging-ecr-registry }}
      run: python3 "$GITHUB_ACTION_PATH/verify_promotion.py"
