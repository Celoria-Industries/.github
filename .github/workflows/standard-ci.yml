name: Standard CI Pipeline

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to configure (e.g. '22', '24', '26')"
        required: false
        type: string
        default: "26"
      working-directory:
        description: "Working directory relative to repository root"
        required: false
        type: string
        default: "."
      run-lint:
        description: "Execute linting and code formatting checks"
        required: false
        type: boolean
        default: true
      run-typecheck:
        description: "Execute TypeScript compiler type checking"
        required: false
        type: boolean
        default: true
      run-tests:
        description: "Execute automated unit & integration test suites"
        required: false
        type: boolean
        default: true
      run-build:
        description: "Execute application build and packaging verification"
        required: false
        type: boolean
        default: true
      enable-codeql:
        description: "Enable GitHub Advanced Security CodeQL static analysis (SAST)"
        required: false
        type: boolean
        default: false
      enable-dependency-review:
        description: "Enable GitHub Advanced Security Dependency Review for pull requests"
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        description: "Optional Codecov token for test coverage reporting"
        required: false

permissions:
  contents: read

jobs:
  node-ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install Dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "Installing dependencies with npm ci..."
            npm ci
          else
            echo "package-lock.json not found; running npm install..."
            npm install
          fi

      - name: Run Native npm Audit
        shell: bash
        run: npm audit --audit-level=high

      - name: Code Quality & Linting
        if: ${{ inputs.run-lint }}
        shell: bash
        run: |
          echo "Executing linter (ESLint / Biome)..."
          npm run lint --if-present

      - name: TypeScript Type Check
        if: ${{ inputs.run-typecheck }}
        shell: bash
        run: |
          echo "Executing TypeScript type verification..."
          if [ -f tsconfig.json ]; then
            npx --no-install tsc --noEmit || npm run typecheck --if-present
          else
            npm run typecheck --if-present
          fi

      - name: Automated Tests
        if: ${{ inputs.run-tests }}
        shell: bash
        run: |
          echo "Executing test suite (Vitest / Jest / Node Test Runner)..."
          npm test --if-present -- --passWithNoTests

      - name: Build Verification
        if: ${{ inputs.run-build }}
        shell: bash
        run: |
          echo "Executing application build..."
          npm run build --if-present

  codeql-analysis:
    name: GHAS CodeQL SAST Analysis
    if: ${{ inputs.enable-codeql }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'javascript-typescript'
          queries: security-extended,security-and-quality

      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install Dependencies for Build Analysis
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  dependency-review:
    name: GHAS Dependency Review & Security Audit
    if: ${{ inputs.enable-dependency-review && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Run GitHub Dependency Review (Pull Requests)
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
