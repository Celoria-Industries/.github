name: Staging promotion gate

on:
  workflow_call:
    inputs:
      promotion-pr-number:
        description: Merged PR number containing the reviewed staging-promotion manifest
        required: true
        type: number
    outputs:
      promotion-kind:
        description: Operation performed by the gate
        value: ${{ jobs.promote.outputs.promotion_kind }}
      source-commit:
        description: Reviewed source commit promoted to staging
        value: ${{ jobs.promote.outputs.source_commit }}
      promoted-digest:
        description: Image digest copied to staging; empty for Terraform promotions
        value: ${{ jobs.promote.outputs.promoted_digest }}
      producer-run-id:
        description: Verified Terraform plan producer run; empty for image promotions
        value: ${{ jobs.promote.outputs.producer_run_id }}
      plan-artifact-id:
        description: Verified saved-plan artifact ID; empty for image promotions
        value: ${{ jobs.promote.outputs.plan_artifact_id }}
      evidence-artifact-id:
        description: Verified signed-evidence artifact ID; empty for image promotions
        value: ${{ jobs.promote.outputs.evidence_artifact_id }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify reviewed promotion evidence
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      promotion_kind: ${{ steps.gate.outputs.promotion-kind }}
      source_commit: ${{ steps.gate.outputs.source-commit }}
      source_repository: ${{ steps.gate.outputs.source-repository }}
      image_repository: ${{ steps.gate.outputs.image-repository }}
      image_digest: ${{ steps.gate.outputs.image-digest }}
      manifest_sha256: ${{ steps.gate.outputs.manifest-sha256 }}
      producer_run_id: ${{ steps.gate.outputs.producer-run-id }}
      plan_artifact_id: ${{ steps.gate.outputs.plan-artifact-id }}
      evidence_artifact_id: ${{ steps.gate.outputs.evidence-artifact-id }}
    steps:
      - name: Stop disabled staging promotion
        shell: bash
        run: |
          echo "::error::Staging image promotion and Terraform apply are disabled pending security and integrity validation."
          exit 1

      - name: Validate promotion request
        id: gate
        uses: Celoria-Industries/.github/.github/actions/staging-promotion-gate@58a4ab32b02046ce565f4426c5791a5b43f672ce
        with:
          promotion-pr-number: ${{ inputs.promotion-pr-number }}
          trusted-image-producer-workflow: ${{ vars.STAGING_TRUSTED_IMAGE_WORKFLOW }}
          trusted-plan-producer-workflow: ${{ vars.STAGING_TRUSTED_PLAN_WORKFLOW }}
          plan-target-account-id: ${{ vars.STAGING_PLAN_TARGET_ACCOUNT_ID }}
          plan-target-region: ${{ vars.STAGING_PLAN_TARGET_REGION }}
          plan-root: ${{ vars.STAGING_PLAN_ROOT }}
          plan-signing-key-arn: ${{ vars.STAGING_PLAN_SIGNING_KEY_ARN }}

  promote:
    name: Promote verified artifact to staging
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-promotion
      cancel-in-progress: false
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      promotion_kind: ${{ needs.verify.outputs.promotion_kind }}
      source_commit: ${{ needs.verify.outputs.source_commit }}
      promoted_digest: ${{ steps.copy.outputs.promoted_digest }}
      producer_run_id: ${{ needs.verify.outputs.producer_run_id }}
      plan_artifact_id: ${{ needs.verify.outputs.plan_artifact_id }}
      evidence_artifact_id: ${{ needs.verify.outputs.evidence_artifact_id }}
    steps:
      - name: Stop disabled staging writer
        shell: bash
        run: |
          echo "::error::Staging writer is disabled pending security and integrity validation."
          exit 1

      - name: Download exact signed Terraform artifacts
        if: needs.verify.outputs.promotion_kind == 'terraform'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.verify.outputs.plan_artifact_id }},${{ needs.verify.outputs.evidence_artifact_id }}
          path: ${{ runner.temp }}/staging-plan-artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify.outputs.producer_run_id }}
          digest-mismatch: error

      - name: Revalidate reviewed image evidence
        id: image-gate
        if: needs.verify.outputs.promotion_kind == 'image'
        uses: Celoria-Industries/.github/.github/actions/staging-promotion-gate@58a4ab32b02046ce565f4426c5791a5b43f672ce
        with:
          promotion-pr-number: ${{ inputs.promotion-pr-number }}
          expected-manifest-sha: ${{ needs.verify.outputs.manifest_sha256 }}
          trusted-image-producer-workflow: ${{ vars.STAGING_TRUSTED_IMAGE_WORKFLOW }}
          trusted-plan-producer-workflow: ${{ vars.STAGING_TRUSTED_PLAN_WORKFLOW }}
          plan-target-account-id: ${{ vars.STAGING_PLAN_TARGET_ACCOUNT_ID }}
          plan-target-region: ${{ vars.STAGING_PLAN_TARGET_REGION }}
          plan-root: ${{ vars.STAGING_PLAN_ROOT }}
          plan-signing-key-arn: ${{ vars.STAGING_PLAN_SIGNING_KEY_ARN }}

      - name: Verify downloaded Terraform plan and KMS signature
        id: plan-gate
        if: needs.verify.outputs.promotion_kind == 'terraform'
        uses: Celoria-Industries/.github/.github/actions/staging-promotion-gate@58a4ab32b02046ce565f4426c5791a5b43f672ce
        with:
          promotion-pr-number: ${{ inputs.promotion-pr-number }}
          expected-manifest-sha: ${{ needs.verify.outputs.manifest_sha256 }}
          trusted-image-producer-workflow: ${{ vars.STAGING_TRUSTED_IMAGE_WORKFLOW }}
          trusted-plan-producer-workflow: ${{ vars.STAGING_TRUSTED_PLAN_WORKFLOW }}
          plan-artifact-path: ${{ runner.temp }}/staging-plan-artifacts/staging-terraform-plan/tfplan
          evidence-record-path: ${{ runner.temp }}/staging-plan-artifacts/staging-terraform-evidence/evidence.json
          evidence-signature-path: ${{ runner.temp }}/staging-plan-artifacts/staging-terraform-evidence/signature.b64
          plan-target-account-id: ${{ vars.STAGING_PLAN_TARGET_ACCOUNT_ID }}
          plan-target-region: ${{ vars.STAGING_PLAN_TARGET_REGION }}
          plan-root: ${{ vars.STAGING_PLAN_ROOT }}
          plan-signing-key-arn: ${{ vars.STAGING_PLAN_SIGNING_KEY_ARN }}
          plan-signing-public-key-der-b64: ${{ vars.STAGING_PLAN_SIGNING_PUBLIC_KEY_DER_B64 }}

      - name: Validate staging image writer configuration
        if: needs.verify.outputs.promotion_kind == 'image'
        env:
          ROLE_ARN: ${{ vars.STAGING_PROMOTION_ROLE_ARN }}
          STAGING_ECR_REGISTRY: ${{ vars.STAGING_ECR_REGISTRY }}
          STAGING_AWS_REGION: ${{ vars.STAGING_AWS_REGION }}
          DEV_ECR_REGISTRY: ${{ vars.DEV_ECR_REGISTRY }}
          DEV_AWS_REGION: ${{ vars.DEV_AWS_REGION }}
        shell: bash
        run: |
          set -euo pipefail
          registry_re='^([0-9]{12})\.dkr\.ecr\.([a-z0-9-]+)\.amazonaws\.com$'
          role_re='^arn:aws:iam::([0-9]{12}):role/[A-Za-z0-9+=,.@_/-]+$'
          [[ "$STAGING_ECR_REGISTRY" =~ $registry_re ]] || { echo "::error::Invalid STAGING_ECR_REGISTRY"; exit 1; }
          staging_account="${BASH_REMATCH[1]}"
          staging_region="${BASH_REMATCH[2]}"
          [[ "$STAGING_AWS_REGION" == "$staging_region" ]] || { echo "::error::STAGING_AWS_REGION does not match STAGING_ECR_REGISTRY"; exit 1; }
          [[ "$ROLE_ARN" =~ $role_re && "${BASH_REMATCH[1]}" == "$staging_account" ]] || { echo "::error::STAGING_PROMOTION_ROLE_ARN must be in the staging ECR account"; exit 1; }
          [[ "$DEV_ECR_REGISTRY" =~ $registry_re ]] || { echo "::error::Invalid DEV_ECR_REGISTRY"; exit 1; }
          [[ "$DEV_AWS_REGION" == "${BASH_REMATCH[2]}" ]] || { echo "::error::DEV_AWS_REGION does not match DEV_ECR_REGISTRY"; exit 1; }

      - name: Validate staging Terraform apply configuration
        id: validate-terraform
        if: needs.verify.outputs.promotion_kind == 'terraform'
        env:
          STATE_ROLE_ARN: ${{ vars.AWS_ROLE_ARN_STAGING_APPLY }}
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN_STAGING_APPLY }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET_STAGING }}
          TARGET_ACCOUNT_ID: ${{ vars.STAGING_PLAN_TARGET_ACCOUNT_ID }}
          TARGET_REGION: ${{ vars.STAGING_PLAN_TARGET_REGION }}
          TERRAFORM_ROOT: ${{ vars.STAGING_PLAN_ROOT }}
          SIGNING_KEY_ARN: ${{ vars.STAGING_PLAN_SIGNING_KEY_ARN }}
          PUBLIC_KEY: ${{ vars.STAGING_PLAN_SIGNING_PUBLIC_KEY_DER_B64 }}
          TRUSTED_PLAN_WORKFLOW: ${{ vars.STAGING_TRUSTED_PLAN_WORKFLOW }}
        shell: bash
        run: |
          set -euo pipefail
          role_re='^arn:aws:iam::([0-9]{12}):role/[A-Za-z0-9+=,.@_/-]+$'
          [[ "$STATE_ROLE_ARN" =~ $role_re ]] || { echo "::error::Configure AWS_ROLE_ARN_STAGING_APPLY"; exit 1; }
          state_account="${BASH_REMATCH[1]}"
          [[ "$DEPLOY_ROLE_ARN" =~ $role_re ]] || { echo "::error::Configure AWS_DEPLOY_ROLE_ARN_STAGING_APPLY"; exit 1; }
          [[ "${BASH_REMATCH[1]}" == "$TARGET_ACCOUNT_ID" ]] || { echo "::error::Staging deploy-apply role account does not match the approved target"; exit 1; }
          [[ "$state_account" != "$TARGET_ACCOUNT_ID" ]] || { echo "::error::Bootstrap state-apply role and staging deploy account must be distinct"; exit 1; }
          [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { echo "::error::Configure TF_STATE_BUCKET_STAGING"; exit 1; }
          [[ "$TARGET_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::Configure STAGING_PLAN_TARGET_ACCOUNT_ID"; exit 1; }
          [[ "$TARGET_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]$ ]] || { echo "::error::Configure STAGING_PLAN_TARGET_REGION"; exit 1; }
          [[ "$TERRAFORM_ROOT" =~ ^stacks/[a-z0-9][a-z0-9-]*/staging/[a-z0-9][a-z0-9-]*(/[a-z0-9][a-z0-9-]*)*$ ]] || { echo "::error::Configure STAGING_PLAN_ROOT"; exit 1; }
          [[ "$SIGNING_KEY_ARN" =~ ^arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-f-]{36}$ ]] || { echo "::error::Configure STAGING_PLAN_SIGNING_KEY_ARN"; exit 1; }
          [[ "$PUBLIC_KEY" =~ ^[A-Za-z0-9+/]+=*$ ]] || { echo "::error::Configure STAGING_PLAN_SIGNING_PUBLIC_KEY_DER_B64"; exit 1; }
          [[ "$TRUSTED_PLAN_WORKFLOW" =~ ^Celoria-Industries/\.github/\.github/workflows/staging-terraform-plan\.yml@[0-9a-f]{40}$ ]] || { echo "::error::Configure STAGING_TRUSTED_PLAN_WORKFLOW to an immutable central workflow SHA"; exit 1; }
          printf 'state_account=%s\n' "$state_account" >> "$GITHUB_OUTPUT"

      - name: Check out the exact reviewed Terraform source commit
        if: needs.verify.outputs.promotion_kind == 'terraform'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source_commit }}
          persist-credentials: false

      - name: Set up Terraform for saved-plan apply
        if: needs.verify.outputs.promotion_kind == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.10.5

      - name: Configure staging image promotion credentials
        if: needs.verify.outputs.promotion_kind == 'image'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.STAGING_PROMOTION_ROLE_ARN }}
          aws-region: ${{ vars.STAGING_AWS_REGION }}
          role-session-name: StagingPromotion-${{ github.run_id }}

      - name: Configure staging state apply credentials
        if: needs.verify.outputs.promotion_kind == 'terraform'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_STAGING_APPLY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
          role-session-name: StagingTfApply-${{ github.run_id }}

      - name: Configure the member-account deploy-apply profile
        if: needs.verify.outputs.promotion_kind == 'terraform'
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN_STAGING_APPLY }}
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/aws-deploy-config"
          actor="$(printf '%s' "$GITHUB_ACTOR" | tr -c 'A-Za-z0-9+=,.@-' '-' | cut -c1-40)"
          {
            echo "[profile deploy]"
            echo "role_arn = $DEPLOY_ROLE_ARN"
            echo "credential_source = Environment"
            echo "role_session_name = tf-apply-${actor}-${GITHUB_RUN_ID}"
          } > "$config"
          echo "AWS_CONFIG_FILE=$config" >> "$GITHUB_ENV"

      - name: Verify state and staging account identities
        if: needs.verify.outputs.promotion_kind == 'terraform'
        env:
          EXPECTED_STATE_ACCOUNT: ${{ steps.validate-terraform.outputs.state_account }}
          TARGET_ACCOUNT_ID: ${{ vars.STAGING_PLAN_TARGET_ACCOUNT_ID }}
          TARGET_REGION: ${{ vars.STAGING_PLAN_TARGET_REGION }}
        shell: bash
        run: |
          set -euo pipefail
          state_account="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$state_account" == "$EXPECTED_STATE_ACCOUNT" ]] || { echo "::error::State-apply role resolved to the wrong bootstrap account"; exit 1; }
          deploy_account="$(aws sts get-caller-identity --profile deploy --region "$TARGET_REGION" --query Account --output text)"
          [[ "$deploy_account" == "$TARGET_ACCOUNT_ID" ]] || { echo "::error::Deploy-apply profile resolved to the wrong staging account"; exit 1; }

      - name: Copy exact reviewed image digest to staging
        id: copy
        if: needs.verify.outputs.promotion_kind == 'image'
        env:
          AWS_REGION: ${{ vars.STAGING_AWS_REGION }}
          DEV_AWS_REGION: ${{ vars.DEV_AWS_REGION }}
          DEV_ECR_REGISTRY: ${{ vars.DEV_ECR_REGISTRY }}
          STAGING_ECR_REGISTRY: ${{ vars.STAGING_ECR_REGISTRY }}
          IMAGE_REPOSITORY: ${{ needs.verify.outputs.image_repository }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source_commit }}
          EXPECTED_DIGEST: ${{ needs.verify.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          source_account="${DEV_ECR_REGISTRY%%.*}"
          destination_account="${STAGING_ECR_REGISTRY%%.*}"
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$actual_account" == "$destination_account" ]] || { echo "::error::Staging role resolved to the wrong AWS account"; exit 1; }

          source_by_tag="$(aws ecr batch-get-image \
            --region "$DEV_AWS_REGION" \
            --registry-id "$source_account" \
            --repository-name "$IMAGE_REPOSITORY" \
            --image-ids "imageTag=${SOURCE_COMMIT}" \
            --output json)"
          source_tag_digest="$(jq -er '.images | if length == 1 then .[0].imageDigest else error("source tag not found") end' <<<"$source_by_tag")"
          [[ "$source_tag_digest" == "$EXPECTED_DIGEST" ]] || { echo "::error::Dev SHA tag does not resolve to the reviewed image digest"; exit 1; }

          destination_image="$(aws ecr batch-get-image \
            --region "$AWS_REGION" \
            --registry-id "$destination_account" \
            --repository-name "$IMAGE_REPOSITORY" \
            --image-ids "imageTag=${SOURCE_COMMIT}" \
            --output json)"
          if jq -e '.images | length == 1' >/dev/null <<<"$destination_image"; then
            destination_digest="$(jq -er '.images[0].imageDigest' <<<"$destination_image")"
            [[ "$destination_digest" == "$EXPECTED_DIGEST" ]] || { echo "::error::Staging already has a different image for this source commit"; exit 1; }
          else
            failure="$(jq -r '.failures[0].failureCode // empty' <<<"$destination_image")"
            [[ "$failure" == "ImageNotFound" ]] || { echo "::error::Could not inspect staging destination image"; exit 1; }

            auth_file="$RUNNER_TEMP/ecr-auth.json"
            aws ecr get-login-password --region "$DEV_AWS_REGION" \
              | podman login --authfile "$auth_file" --username AWS --password-stdin "$DEV_ECR_REGISTRY"
            aws ecr get-login-password --region "$AWS_REGION" \
              | podman login --authfile "$auth_file" --username AWS --password-stdin "$STAGING_ECR_REGISTRY"
            source_image="${DEV_ECR_REGISTRY}/${IMAGE_REPOSITORY}@${EXPECTED_DIGEST}"
            destination_image="${STAGING_ECR_REGISTRY}/${IMAGE_REPOSITORY}:${SOURCE_COMMIT}"
            podman pull --all --authfile "$auth_file" "$source_image"
            digest_file="$RUNNER_TEMP/staging-image-digest"
            podman push --all --authfile "$auth_file" --digestfile "$digest_file" \
              "$source_image" "docker://${destination_image}"
            promoted_digest="$(cat "$digest_file")"
            [[ "$promoted_digest" == "$EXPECTED_DIGEST" ]] || { echo "::error::Staging image digest changed during copy"; exit 1; }
          fi
          echo "promoted_digest=$EXPECTED_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Promoted ${IMAGE_REPOSITORY}@${EXPECTED_DIGEST} for source ${SOURCE_COMMIT}." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply only the verified saved Terraform plan
        if: needs.verify.outputs.promotion_kind == 'terraform'
        env:
          PLAN_PATH: ${{ runner.temp }}/staging-plan-artifacts/staging-terraform-plan/tfplan
          TERRAFORM_ROOT: ${{ vars.STAGING_PLAN_ROOT }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET_STAGING }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
          TARGET_REGION: ${{ vars.STAGING_PLAN_TARGET_REGION }}
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$PLAN_PATH" ]] || { echo "::error::Verified Terraform saved plan is missing"; exit 1; }
          terraform -chdir="$TERRAFORM_ROOT" init -input=false -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=$TERRAFORM_ROOT/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"
          terraform -chdir="$TERRAFORM_ROOT" apply -input=false -lock-timeout=10m "$PLAN_PATH"
          printf 'Applied the reviewed saved plan for `%s` to staging account `%s` in `%s`.\n' \
            "$TERRAFORM_ROOT" "${{ vars.STAGING_PLAN_TARGET_ACCOUNT_ID }}" "$TARGET_REGION" \
            >> "$GITHUB_STEP_SUMMARY"
