name: CI/CD Pipeline

on:
  push:
    branches: [ $default-branch ]
  pull_request:
    branches: [ $default-branch ]

permissions:
  contents: read

jobs:
  ci:
    name: Celoria Standard CI
    uses: Celoria-Industries/.github/.github/workflows/standard-ci.yml@main
    with:
      node-version: '20'
      working-directory: '.'
      run-lint: true
      run-typecheck: true
      run-tests: true
      run-build: true
      enable-codeql: true
      enable-dependency-review: true
    secrets: inherit
