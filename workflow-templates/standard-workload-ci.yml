name: CI/CD Pipeline

on:
  push:
    branches: [ $default-branch ]
  pull_request:
    branches: [ $default-branch ]

permissions:
  contents: read

jobs:
  ci:
    name: Celoria Standard CI
    uses: Celoria-Industries/.github/.github/workflows/standard-ci.yml@main
    with:
      runtime: 'auto'
      python-version: '3.12'
      node-version: '20'
      working-directory: '.'
      run-lint: true
      run-tests: true
      run-build: true
      run-security-scan: true
    secrets: inherit
