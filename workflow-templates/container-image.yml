name: Container Image

on:
  push:
    branches: [ $default-branch ]
  pull_request:
    branches: [ $default-branch ]
  workflow_dispatch:
    inputs:
      commit:
        description: "Full SHA of a main-branch ancestor (blank for main)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  image:
    uses: Celoria-Industries/.github/.github/workflows/container-image.yml@main
    with:
      image-name: REPLACE_ME
      cache-repository: REPLACE_ME-cache
      aws-region: us-east-2
      ecr-push-role-arn: arn:aws:iam::REPLACE_ACCOUNT:role/REPLACE_ROLE
      push: ${{ github.event_name != 'pull_request' }}
      commit: ${{ inputs.commit || '' }}
