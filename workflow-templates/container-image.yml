name: Container Image

on:
  push:
    branches: [ $default-branch ]
  pull_request:
    branches: [ $default-branch ]

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: Celoria-Industries/.github/.github/workflows/container-image.yml@main
    with:
      image-name: celoria-industries/REPLACE_ME
      push: ${{ github.event_name == 'push' }}
